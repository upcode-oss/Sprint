[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upcode-sprint-backend"
version = "0.1.0"
description = "Self-hosted agile project management API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "slowapi>=0.1.9,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"
